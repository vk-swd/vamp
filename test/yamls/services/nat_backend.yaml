# RustNAT: sits between the Rust subnet (backend) and the Edge subnet.
# Uses the generic configure_nat_node.sh routing script: enables forwarding, masquerades
# outbound edge traffic and only allows established/related traffic back in, so backend
# can reach the Sigturn machine (via vps_front) but nothing can reach backend unsolicited.
services:
  nat_backend:
    image: router
    tty: true
    stdin_open: true
    container_name: ${NAT_A_NAME}
    cap_add:
      - NET_ADMIN
    entrypoint: ["/bin/sh", "/configure_nat_node.sh", "${NAT_A_NIF}", "${NAT_A_EDGE_NIF}"]
    volumes:
      - configure_nat_script:/configure_nat_node.sh
    networks:
      backend_net:
        interface_name: ${NAT_A_NIF}
        ipv4_address: ${NAT_A_ADDR}
      edge:
        interface_name: ${NAT_A_EDGE_NIF}
