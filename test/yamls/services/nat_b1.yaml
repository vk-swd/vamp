# BrowserNAT1: sits between Browser Subnet 1 (Browser IF1) and the Edge subnet.
# Same routing/forwarding behaviour as nat_backend: lets the browser reach the signalling server
# through the edge subnet while blocking unsolicited inbound connections.
services:
  nat_b1:
    extends:
      file: ./router_base.yaml
      service: router_base
    container_name: ${NAT_B1_NAME}
    entrypoint: ["/bin/sh", "/configure_nat_node.sh", "${NAT_B1_NIF}", "${NAT_B1_EDGE_NIF}"]
    volumes:
      - ${REPO_ROOT}/configure_nat_node.sh:/configure_nat_node.sh
    networks:
      browser_net_1:
        interface_name: ${NAT_B1_NIF}
        ipv4_address: ${NAT_B1_ADDR}
      edge:
        interface_name: ${NAT_B1_EDGE_NIF}
