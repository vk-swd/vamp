networks:
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: ${EDGE_SUBNET}
  local_v:
    driver: bridge
    ipam:
      config:
        - subnet: ${LOCAL_V_SUBNET}
  local_a:
    driver: bridge
    ipam:
      config:
        - subnet: ${LOCAL_A_SUBNET}
  local_b:
    driver: bridge
    ipam:
      config:
        - subnet: ${LOCAL_B_SUBNET}

services:
  router:
    build:
      dockerfile_inline: |
        FROM alpine:3.22.4
        RUN apk update
        RUN apk add iptables iproute2 tcpdump curl wget procps net-tools iputils-ping
    image: router
    profiles: ["build"]
  browserpup:
    build:
      dockerfile_inline: |
        FROM ghcr.io/puppeteer/puppeteer:25.1.0
        USER root
        RUN apt update 
        RUN apt install -y gosu
        RUN apt install -y iptables iproute2 tcpdump curl wget procps net-tools iputils-ping
    image: browserpup
    profiles: ["build"]
  sigturn_img:
    build:
      dockerfile_inline: |
        FROM alpine:3.22.4
        RUN apk update
        RUN apk add nginx coturn
        RUN apk add envsubst
        RUN apk add iptables iproute2 tcpdump curl wget procps net-tools iputils-ping
    image: sigturn_img
    profiles: ["build"]
  vps_front:
    image: router
    tty: true
    stdin_open: true
    hostname: ${VPS_FRONT_NAME}
    container_name: ${VPS_FRONT_NAME}
    cap_add:
      - NET_ADMIN
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo 1 > /proc/sys/net/ipv4/ip_forward
        iptables -t nat -A PREROUTING -i ${VPS_FRONT_EDGE_NIC} -j DNAT --to-destination ${SIGTURN_IP}
        iptables -t nat -A POSTROUTING -o ${VPS_FRONT_EDGE_NIC} -j MASQUERADE
        tail -f /dev/null
    networks:
      edge:
        interface_name: ${VPS_FRONT_EDGE_NIC}
        ipv4_address: ${VPS_EDGE_IP}
      local_v:
        interface_name: ${VPS_FRONT_LOCAL_NIC}
        ipv4_address: ${VPS_FRONT_LOCAL_ADDR}
  sigturn:
    image: sigturn_img
    tty: true
    stdin_open: true
    hostname: ${SIGTURN_NAME}
    container_name: ${SIGTURN_NAME}
    cap_add:
      - NET_ADMIN
    entrypoint:
      - /bin/sh
      - -c
      - |
        ip route add ${EDGE_SUBNET} via ${VPS_FRONT_LOCAL_ADDR}
        envsubst < /etc/coturn/turnserver.conf.template > /etc/coturn/turnserver.conf
        turnserver --daemon
        tail -f /dev/null
    environment:
      - COTURN_PORT=${COTURN_PORT}
      - VPS_EDGE_IP=${VPS_EDGE_IP}
      - VPS_FRONT_LOCAL_ADDR=${VPS_FRONT_LOCAL_ADDR}
      - VPS_FRONT_NAME=${VPS_FRONT_NAME}
      - SIGTURN_IP=${SIGTURN_IP}
      - STUN_CREDENTIALS=${STUN_CREDENTIALS}
    volumes:
      - ./test/turn/turnserver.conf.template:/etc/coturn/turnserver.conf.template
    networks:
      local_v:
        ipv4_address: ${SIGTURN_IP}
    depends_on:
      - vps_front
   
  nat_b:
    image: router
    tty: true
    stdin_open: true
    container_name: ${NAT_B_NAME}
    cap_add:
      - NET_ADMIN
    entrypoint: ["/bin/sh", "/configure_nat_node.sh", "${NAT_B_LOCAL_NIC}", "${NAT_B_EDGE_NIC}"]
    volumes:
      - ./configure_nat_node.sh:/configure_nat_node.sh
    networks:
      local_b:
        interface_name: ${NAT_B_LOCAL_NIC}
        ipv4_address: ${NAT_B_ADDR}
      edge:
        interface_name: ${NAT_B_EDGE_NIC}
  browser:
    image: browserpup
    container_name: ${BROWSER_NAME}
    tty: true
    stdin_open: true
    cap_add:
      - NET_ADMIN
    entrypoint:
      - /bin/sh
      - -c
      - |
        ip route add ${EDGE_SUBNET} via ${NAT_B_ADDR}
        exec gosu pptruser sh -c "cp /browser/test.js ~/test.js; cp /browser/package.json ~/package.json; tail -f /dev/null"
    volumes:
      - ./test/browser:/browser
    environment:
      - COTURN_PORT=${COTURN_PORT}
      - COTURN_IP=${VPS_EDGE_IP}
      - SS_IP=${VPS_EDGE_IP}
      - STUN_CREDENTIALS=${STUN_CREDENTIALS}
    networks:
      - local_b
    depends_on:
      - nat_b
  nat_a:
    image: router
    tty: true
    stdin_open: true
    container_name: ${NAT_A_NAME}
    cap_add:
      - NET_ADMIN
    entrypoint: ["/bin/sh", "/configure_nat_node.sh", "${NAT_A_LOCAL_NIC}", "${NAT_A_EDGE_NIC}"]
    volumes:
      - ./configure_nat_node.sh:/configure_nat_node.sh
    networks:
      local_a:
        interface_name: ${NAT_A_LOCAL_NIC}
        ipv4_address: ${NAT_A_ADDR}
      edge:
        interface_name: ${NAT_A_EDGE_NIC}
  appserver:
    image: alpine:3.22.4
    container_name: ${APPSERVER_NAME}
    tty: true
    stdin_open: true
    cap_add:
      - NET_ADMIN
    entrypoint:
      - /bin/sh
      - -c
      - |
        apk add --no-cache iproute2
        ip route add ${EDGE_SUBNET} via ${NAT_A_ADDR}
        tail -f /dev/null
    networks:
      - local_a
    depends_on:
      - nat_a