<!doctype html>
<html>
<head>
</head>
<body>
  <div id="controls">
    <button id="btn-test-memo">Load test/memo.md</button>
    <button id="btn-rtc-memo">Load src-tauri/rtc/memo.md</button>
    <button id="btn-signalling-memo">Load src-tauri/signalling/memo.md</button>
  </div>
  <div id="content"></div>

  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
    import { marked } from "https://cdn.jsdelivr.net/npm/marked@16.2.1/lib/marked.esm.js";

    mermaid.initialize({
      startOnLoad: false
    });

    async function loadMarkdown(path) {
      const md = await fetch(path).then(r => r.text());

      document.getElementById("content").innerHTML = marked.parse(md);

      // Convert marked's output into Mermaid blocks
      document.querySelectorAll("pre code.language-mermaid").forEach((block) => {
        const pre = block.parentElement;
        pre.className = "mermaid";
        pre.textContent = block.textContent;
      });

      await mermaid.run();
    }
    document.getElementById("btn-test-memo").addEventListener("click", () => loadMarkdown("test/memo.md"));
    document.getElementById("btn-rtc-memo").addEventListener("click", () => loadMarkdown("src-tauri/rtc/memo.md"));
    document.getElementById("btn-signalling-memo").addEventListener("click", () => loadMarkdown("src-tauri/signalling/memo.md"));

    await loadMarkdown("src-tauri/rtc/memo.md");
  </script>
</body>
</html>
